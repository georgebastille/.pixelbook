# Build a Unified Kernel Image instead of a separate initramfs
uefi="yes"

# If your ESP isn’t at /efi, dracut still finds it (it checks /efi, /boot, /boot/efi).
# Default UKI output is: <ESP>/EFI/Linux/linux-$kernel-$MACHINE_ID[-$BUILD_ID].efi
# (No need to set a filename unless you want to.)
# uefi_stub defaults to /lib/systemd/boot/efi/linuxx64.efi.stub if present.

# Minimal, host-only image and fast compression:
hostonly="yes"
omit_dracutmodules+=" resume qemu virtiofs crypt btrfs "
compress="zstd"

# Your kernel command line (goes into the UKI’s .cmdline section).
# Reuse what you had in GRUB_CMDLINE_LINUX_DEFAULT.
kernel_cmdline="loglevel=3 rd.udev.log_level=3 rd.luks=0 rd.lvm=0 rd.md=0 rd.dm=0 rootfstype=ext4 i915.enable_psr=1 i915.enable_dc=2 i915.enable_fbc=1 noresume mitigations=off nmi_watchdog=0"
# If you enabled Secure Boot and want dracut to sign the UKI as it builds:
# (paths created by sbctl)
# uefi_secureboot_cert="/var/lib/sbctl/keys/db/db.pem"
# uefi_secureboot_key="/var/lib/sbctl/keys/db/db.key"
