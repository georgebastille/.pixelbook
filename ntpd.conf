# OpenNTPD configuration for UK
# Reference: man ntpd.conf, docs.voidlinux.org

# Use UK-based NTP servers and Cloudflare as fallback
servers uk.pool.ntp.org 
server time.cloudflare.com 

# Use hardware clock and system sensors for drift correction
sensor *

# Use network constraints for extra sanity checking
constraint from "9.9.9.9"          
constraint from "2620:fe::fe"      
constraints from "www.google.co.uk" 

